name: Elite engine CI

on:
  pull_request:
    paths:
      - 'elite_engine/**'
      - '.github/workflows/elite-engine-ci.yml'
  push:
    branches: [main]
    paths:
      - 'elite_engine/**'
      - '.github/workflows/elite-engine-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover elite_engine/tests -v
