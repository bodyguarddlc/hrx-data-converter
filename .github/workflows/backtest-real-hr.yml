name: Backtest real MLB HR model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backtest-real-hr.yml'
      - 'backtest_hr_real.py'
      - 'train_hr_real.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 pandas==2.2.3 pyarrow==25.0.1 \
            scikit-learn==1.8.0 xgboost==3.1.3 joblib requests pybaseball

      - name: Download Statcast history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source fallback
          base='https://raw.githubusercontent.com/sportsdataverse/baseballr-data/main/mlb/statcast_raw'
          fetch() {
            y="$1"; m="$2"; out="source/${y}-${m}.parquet"
            curl --fail --location --retry 5 --retry-delay 3 -o "$out" "$base/$y/${y}-${m}.parquet"
          }
          for m in 03 04 05 06 07 08 09 10 11; do fetch 2023 "$m"; done
          for m in 03 04 05 06 07 08 09 10; do fetch 2024 "$m"; done
          for m in 03 04 05 06 07 08 09 10 11; do fetch 2025 "$m"; done
          for m in 03 04 05 06 07 08; do fetch 2026 "$m"; done
          curl --fail --location --retry 5 --retry-delay 3 \
            -o fallback/2026-09.parquet "$base/2026/2026-09.parquet"

      - name: Patch September 2026 from Baseball Savant
        shell: python
        run: |
          import json, shutil
          from pathlib import Path
          import pandas as pd
          from pybaseball import statcast

          need = ['game_date','game_pk','at_bat_number','pitch_number','batter','pitcher','events','stand','p_throws','home_team','away_team','inning_topbot','launch_speed','launch_speed_angle','launch_angle','game_type']
          src=Path('source')
          try:
              df=statcast(start_dt='2026-09-01',end_dt='2026-09-17',verbose=False,parallel=True)
              missing=[c for c in need if c not in df.columns]
              if missing: raise RuntimeError(f'missing columns: {missing}')
              df=df[need].copy()
              df['game_date']=pd.to_datetime(df['game_date'],errors='coerce')
              df=df[df['game_date'].between('2026-09-01','2026-09-17')]
              if not len(df) or str(df['game_date'].max().date())!='2026-09-17':
                  raise RuntimeError('fresh patch did not reach 2026-09-17')
              df.to_parquet(src/'2026-09-fresh.parquet',index=False)
              status={'september_patch':'fresh_pybaseball_baseball_savant','rows':int(len(df)),'max_date':str(df['game_date'].max().date())}
          except Exception as exc:
              shutil.copy2('fallback/2026-09.parquet',src/'2026-09-archive.parquet')
              status={'september_patch':'archive_fallback','warning':repr(exc)}
          (src/'source_status.json').write_text(json.dumps(status,indent=2))
          print(json.dumps(status,indent=2))

      - name: Run expanding-window backtest
        run: |
          python backtest_hr_real.py \
            --source-dir source \
            --start 2023-03-30 \
            --end 2026-09-17 \
            --outdir backtest/annual-2024-2026

      - name: Package backtest
        run: |
          cd backtest/annual-2024-2026
          zip -9 annual_backtest_2024_2026.zip annual_backtest_report.json daily_topk_backtest.csv calibration_bins.csv

      - name: Commit backtest outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f backtest/annual-2024-2026
          git commit -m 'backtest: annual OOS HR results 2024-2026' || exit 0
          git push
