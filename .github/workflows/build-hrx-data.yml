name: Build HRX historical data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow

      - name: Download public Retrosheet parquet files
        run: |
          mkdir -p source output
          curl --fail --location --retry 3 -o source/batting.parquet \
            https://raw.githubusercontent.com/gmalbert/baseball-predictions/main/data_files/retrosheet/batting.parquet
          curl --fail --location --retry 3 -o source/pitching.parquet \
            https://raw.githubusercontent.com/gmalbert/baseball-predictions/main/data_files/retrosheet/pitching.parquet
          curl --fail --location --retry 3 -o source/gameinfo.parquet \
            https://raw.githubusercontent.com/gmalbert/baseball-predictions/main/data_files/retrosheet/gameinfo.parquet

      - name: Filter 2021-2025 and export compressed CSV
        shell: python
        run: |
          import json
          from pathlib import Path
          import pandas as pd

          src = Path('source')
          out = Path('output')
          out.mkdir(exist_ok=True)

          start = 20210101
          end = 20251231

          specs = {
              'batting': [
                  'gid','id','team','b_pa','b_ab','b_r','b_h','b_d','b_t','b_hr',
                  'b_rbi','b_w','b_k','b_sb','b_hbp','b_sf','date','vishome','opp','win','loss'
              ],
              'pitching': [
                  'gid','id','team','p_ipouts','p_bfp','p_h','p_hr','p_r','p_er','p_w','p_iw',
                  'p_k','p_hbp','p_wp','p_bk','p_gs','p_gf','p_cg','wp','lp','save','date',
                  'vishome','opp','win','loss'
              ],
              'gameinfo': [
                  'gid','visteam','hometeam','site','date','number','daynight','usedh','innings',
                  'timeofgame','attendance','fieldcond','precip','sky','temp','winddir','windspeed',
                  'vruns','hruns','wteam','lteam','season'
              ],
          }

          audit = {}
          for name, wanted in specs.items():
              path = src / f'{name}.parquet'
              df = pd.read_parquet(path)
              if 'date' not in df.columns:
                  raise RuntimeError(f'{name}: missing date column')
              date_num = pd.to_numeric(df['date'].astype(str).str.replace('-', '', regex=False).str[:8], errors='coerce')
              df = df[(date_num >= start) & (date_num <= end)].copy()
              keep = [c for c in wanted if c in df.columns]
              df = df[keep]
              dest = out / f'retrosheet_{name}_2021_2025.csv.gz'
              df.to_csv(dest, index=False, compression='gzip')
              audit[name] = {
                  'rows': int(len(df)),
                  'columns': keep,
                  'min_date': str(df['date'].min()) if len(df) else None,
                  'max_date': str(df['date'].max()) if len(df) else None,
                  'output_bytes': dest.stat().st_size,
              }

          with open(out / 'audit.json', 'w', encoding='utf-8') as f:
              json.dump(audit, f, indent=2)

          print(json.dumps(audit, indent=2))

      - name: Upload HRX training inputs
        uses: actions/upload-artifact@v4
        with:
          name: hrx-retrosheet-2021-2025
          path: output/
          if-no-files-found: error
          retention-days: 7
