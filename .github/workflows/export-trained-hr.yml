name: Export trained MLB HR model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-trained-hr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: hr-model-real-2026-09-17
          path: trained/2026-09-17/hr_model_real_2026-09-17.zip
          if-no-files-found: error
          retention-days: 7
