name: Train real MLB HR model through 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/train-real-hr.yml'
      - 'train_hr_real.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install pinned training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 pandas==2.2.3 pyarrow==25.0.1 \
            scikit-learn==1.8.0 xgboost==3.1.3 joblib requests pybaseball

      - name: Download SportsDataverse monthly Statcast archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source fallback
          base='https://raw.githubusercontent.com/sportsdataverse/baseballr-data/main/mlb/statcast_raw'
          fetch() {
            y="$1"; m="$2"; out="source/${y}-${m}.parquet"
            echo "Downloading ${y}-${m}"
            curl --fail --location --retry 5 --retry-delay 3 \
              -o "$out" "$base/$y/${y}-${m}.parquet"
          }
          for m in 03 04 05 06 07 08 09 10 11; do fetch 2023 "$m"; done
          for m in 03 04 05 06 07 08 09 10; do fetch 2024 "$m"; done
          for m in 03 04 05 06 07 08 09 10 11; do fetch 2025 "$m"; done
          for m in 03 04 05 06 07 08; do fetch 2026 "$m"; done
          curl --fail --location --retry 5 --retry-delay 3 \
            -o fallback/2026-09.parquet "$base/2026/2026-09.parquet"
          du -sh source fallback

      - name: Fetch fresh September 2026 Baseball Savant patch
        shell: python
        run: |
          import json, shutil
          from pathlib import Path
          import pandas as pd
          from pybaseball import statcast

          need = ['game_date','game_pk','at_bat_number','pitch_number','batter','pitcher','events','stand','p_throws','home_team','away_team','inning_topbot','launch_speed','launch_speed_angle','launch_angle','game_type']
          src = Path('source')
          status = {}
          try:
              df = statcast(start_dt='2026-09-01', end_dt='2026-09-17', verbose=False, parallel=True)
              missing = [c for c in need if c not in df.columns]
              if missing:
                  raise RuntimeError(f'fresh Savant patch missing columns: {missing}')
              df = df[need].copy()
              df['game_date'] = pd.to_datetime(df['game_date'], errors='coerce')
              df = df[df['game_date'].between('2026-09-01','2026-09-17')]
              df.to_parquet(src/'2026-09-fresh.parquet', index=False)
              status = {
                  'september_patch': 'fresh_pybaseball_baseball_savant',
                  'requested_start': '2026-09-01',
                  'requested_end': '2026-09-17',
                  'rows': int(len(df)),
                  'min_date': str(df['game_date'].min().date()) if len(df) else None,
                  'max_date': str(df['game_date'].max().date()) if len(df) else None,
              }
              if not len(df) or str(df['game_date'].max().date()) != '2026-09-17':
                  raise RuntimeError(f'fresh patch did not reach cutoff: {status}')
          except Exception as exc:
              print('Fresh Savant patch failed; using archived September shard:', repr(exc))
              shutil.copy2('fallback/2026-09.parquet', src/'2026-09-archive.parquet')
              status = {
                  'september_patch': 'sportsdataverse_archive_fallback',
                  'warning': repr(exc),
                  'archive_known_commit_date': '2026-09-10',
              }
          (src/'source_status.json').write_text(json.dumps(status, indent=2))
          print(json.dumps(status, indent=2))

      - name: Train XGBoost + calibration and evaluate 2026 holdout
        run: |
          python train_hr_real.py \
            --source-dir source \
            --start 2023-03-30 \
            --end 2026-09-17 \
            --outdir trained/2026-09-17

      - name: Package trained artifacts
        run: |
          cd trained/2026-09-17
          zip -9 hr_model_real_2026-09-17.zip \
            xgb_model.joblib calibrator.joblib medians.json pa_exposure.csv metadata.json backtest_report.json
          ls -lh

      - name: Commit trained artifacts and metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f trained/2026-09-17
          git commit -m 'train: real MLB HR model through 2026-09-17' || exit 0
          git push
