name: sports-market-engine

on:
  pull_request:
    paths:
      - "sports_market_engine/**"
      - ".github/workflows/sports-market-engine.yml"
  push:
    branches:
      - "feat/sports-market-engine"
    paths:
      - "sports_market_engine/**"
      - ".github/workflows/sports-market-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sports_market_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
