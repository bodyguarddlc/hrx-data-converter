name: EdgeForge tests

on:
  push:
    paths:
      - "edgeforge/**"
      - ".github/workflows/edgeforge-tests.yml"
  pull_request:
    paths:
      - "edgeforge/**"
      - ".github/workflows/edgeforge-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./edgeforge[dev]"
      - run: pytest edgeforge/tests -q
