[project]
name = "sports-market-engine"
version = "0.1.0"
description = "Same-day multi-region sports market scanner and correlation-aware slip optimizer"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.scripts]
sports-scan = "sports_market_engine.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
